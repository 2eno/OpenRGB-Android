# Tests, lint and APKs for every push and pull request; a GitHub release for tags "v*".
#
# Release signing (optional): add these repository secrets
#   RELEASE_KEYSTORE_BASE64   base64 of the .jks file   (base64 -w0 release.jks)
#   RELEASE_KEYSTORE_PASSWORD
#   RELEASE_KEY_ALIAS
#   RELEASE_KEY_PASSWORD      (for PKCS12 keystores, the keytool default, same as the store password)
# Without them the release APK is signed with the runner's throwaway debug key: installable for
# testing, but every build has a different signature, so it cannot update the previous one.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0

      - uses: gradle/actions/setup-gradle@v6

      - name: Version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="0.1.0-ci.${GITHUB_RUN_NUMBER}+$(git rev-parse --short HEAD)"
          fi
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "FILE_VERSION=${name//+/-}" >> "$GITHUB_ENV"

      - name: Release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release APK is signed with the release key."
          else
            echo "::notice::No release keystore secret: the release APK is signed with the debug key."
          fi

      - name: Unit tests
        run: ./gradlew unitTests --continue

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: APKs
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/openrgb-remote-$FILE_VERSION-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/openrgb-remote-$FILE_VERSION-release.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-$FILE_VERSION.txt"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/
            app/build/screenshots/
          if-no-files-found: ignore
          retention-days: 14

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apks
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
